plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// The jar carries the Minecraft version it was built against, on every line including this
// one. All lines share a mod version, and two files both called chatfilter-3.0.0.jar are
// indistinguishable in a mods folder or on a releases page. The mod's own version (in
// neoforge.mods.toml) stays a plain ${mod_version}.
version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")            // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add additional repositories here if required by dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    // Parchment gives human-readable parameter names/javadocs. Optional.
    // Enabled only when both properties are set in gradle.properties (some MC
    // versions may not have Parchment mappings published yet).
    if (project.parchment_minecraft_version?.trim() && project.parchment_mappings_version?.trim()) {
        parchment {
            minecraftVersion = project.parchment_minecraft_version
            mappingsVersion = project.parchment_mappings_version
        }
    }

    // Access Transformers are auto-detected from META-INF/accesstransformer.cfg

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // ./gradlew runServer -Pselftest -- runs SelfTest on ServerStartedEvent and logs a
            // pass/fail block. A -D on the gradlew line would set it on Gradle's JVM instead.
            if (project.hasProperty('selftest')) {
                systemProperty 'chatfilter.selftest', 'true'
            }
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime' declares runtime-only test dependencies that are NOT published.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// SableCraft Standards, version-matched from the sibling build. Standards' build/libs holds a jar
// for every Minecraft line it supports, and a wildcard would hand javac all of them -- the wrong
// one winning compiles against another version's API. fileTree-style provider so an absent jar
// only leaves the integration out of the classpath rather than failing configuration.
def standardsJar = provider {
    def pattern = ~/standards-.*\+mc${minecraft_version}\.jar/
    def found = (file(project.standards_libs).listFiles() ?: [])
            .findAll { it.name ==~ pattern }
            .sort { -it.lastModified() }
    if (found.isEmpty()) {
        logger.lifecycle("Standards: no jar for Minecraft ${minecraft_version} in ${project.standards_libs}")
        return []
    }
    logger.lifecycle("Standards dependency: ${found.first().name}")
    [found.first()]
}

dependencies {
    // A SOFT dependency: compileOnly and never bundled. integration/StandardsBridge is the only
    // class that imports it, and it is only loaded when the standards mod is present.
    compileOnly files(standardsJar)
    // ./gradlew runServer -PwithStandards -- the dev server with Standards loaded beside us, so
    // the seam is tested against the real thing. Off by default: the standalone path matters
    // just as much, and a dev server that always had Standards would never exercise it.
    if (project.hasProperty('withStandards')) {
        localRuntime files(standardsJar)
    }
}

// ---------------------------------------------------------------------------
// Build stamp. A version number answers "which release"; during development that is a
// different question from "which bytes", and the gap has cost real time across this family
// of mods -- a jar rebuilt under an unchanged version, a dependency range admitting a jar it
// could not run against, an instance nobody could tell was stale from the filename.
//
// So the jar records the commit it came from, and says so in the log at startup: the log
// line is the half that matters when somebody reports a bug, because it says what actually
// RAN rather than what is on disk now. The manifest attributes below answer the other
// question -- what a jar on disk is -- without loading it.
//
// Resolved at configure time and tolerant of git being absent (a source zip, a CI checkout
// without history): an unknown stamp must never fail a build.
static String gitOut(File dir, String... args) {
    try {
        var proc = new ProcessBuilder(args).directory(dir).redirectErrorStream(true).start()
        var out = proc.inputStream.text.trim()
        return proc.waitFor() == 0 && !out.isEmpty() ? out : null
    } catch (Exception ignored) {
        return null
    }
}
var buildCommit = gitOut(projectDir, "git", "rev-parse", "--short=8", "HEAD") ?: "unknown"
var buildBranch = gitOut(projectDir, "git", "rev-parse", "--abbrev-ref", "HEAD") ?: "unknown"
var buildDirty  = gitOut(projectDir, "git", "status", "--porcelain")
if (buildDirty) buildCommit += "-dirty"   // built from uncommitted changes; say so
// The COMMIT's time, not the wall clock. A wall-clock stamp changes on every Gradle
// invocation, so generateModMetadata's inputs change every time and processResources and jar
// are never up to date -- a permanent ~20s tax on every no-op build. It also answers the
// better question: the SHA already says which bytes, the jar's mtime says when it was
// written, and on a -dirty build the commit's time loses nothing, because -dirty has already
// said the bytes are not the commit's.
//
// %ct (epoch) rather than %cI, which carries whatever UTC offset the committer's machine had
// -- two builds of one commit on two machines would stamp differently, a hole in exactly the
// reproducibility this is for.
var commitEpoch = gitOut(projectDir, "git", "show", "-s", "--format=%ct", "HEAD")
var buildTime = commitEpoch
        ? new Date(commitEpoch.toLong() * 1000L).format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone("UTC"))
        : "unknown"
logger.lifecycle("Build stamp: ${buildCommit} on ${buildBranch} at ${buildTime}")

// Expand mod metadata properties into the generated neoforge.mods.toml, and the build stamp
// into /chatfilter/build.properties (namespaced -- a bare /build.properties would collide
// with every other mod doing this).
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            build_commit           : buildCommit,
            build_branch           : buildBranch,
            build_time             : buildTime,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// The same stamp on the manifest, beside Implementation-Version: this is what answers
// "is the jar in that instance stale?" from a shell, without loading the mod.
tasks.named('jar', Jar) {
    manifest {
        attributes([
                "Implementation-Title"  : mod_name,
                "Implementation-Version": mod_version,
                "Build-Commit"          : buildCommit,
                "Build-Branch"          : buildBranch,
                "Build-Time"            : buildTime,
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
