# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled for now; some ModDevGradle run tasks interact poorly with it.
org.gradle.configuration-cache=false

# Parchment provides human-readable parameter names/javadocs. Optional.
# Leave blank to disable if no Parchment mappings are published for this MC version yet.
# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=
parchment_mappings_version=

# Environment Properties
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version=26.2
# What we BUILD against is one exact version; what the jar REFUSES to load on is a
# different question. Both ranges below are deliberately wider than the build, so a
# NeoForge or Minecraft bugfix drop doesn't strand the mod on a version nobody runs.
minecraft_version_range=[26.2,26.3)
# The Neo version must agree with the Minecraft version to get a valid artifact.
neo_version=26.2.0.59
# ...but the DEPENDENCY only needs the line, not this build of it. Using neo_version as
# the lower bound would demand 21.11.42+ from anyone on an earlier 21.11 build for no
# reason: nothing here uses an API newer than the line itself.
neo_version_range=[26.2,26.3)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)

## Mod Properties
mod_id=chatfilter
mod_name=ChatFilter ReForged
mod_license=MIT
mod_version=3.0.0
mod_group_id=com.sablednah.chatfilter
mod_authors=Sablednah
mod_description=A server-side chat filter: censors or blocks words in chat and in chat-like commands (/msg, /r, /me and any you list), catches the usual disguises, blocks links and spam, and works with unmodified clients. A modern NeoForge rebuild of the classic ChatFilter Bukkit plugin.

## Dev server
# The port the TestClient.cmd clients join. Must match server-port in run/server.properties
# (gitignored, so set by hand). 25580 is clear of every sibling's dev server.
dev_server_port=25580

## Sibling mods
# Where SableCraft Standards' jars are built. ChatFilter compiles against its chat API (a SOFT
# dependency: compileOnly, never bundled) and picks the jar matching minecraft_version.
standards_libs=../SableCraft-Standards/build/libs
